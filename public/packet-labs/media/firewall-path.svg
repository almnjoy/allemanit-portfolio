<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 196" role="img"><title>Two capture points on the client and service sides of a firewall or routed path.</title><rect width="840" height="196" fill="#0e1319"/><rect x="18" y="42" width="248" height="114" rx="10" fill="#14191d" stroke="#494238"/><text x="142" y="79" text-anchor="middle" fill="#ff9a58" font-size="15" font-family="Arial" font-weight="bold">CLIENT · A</text><text x="142" y="116" text-anchor="middle" fill="#e9e4d8" font-size="12" font-family="Arial">SYN seen at capture A</text><path d="M268 95h26m-7-6 7 6-7 6" fill="none" stroke="#ff842d" stroke-width="2"/><rect x="298" y="42" width="248" height="114" rx="10" fill="#14191d" stroke="#494238"/><text x="422" y="79" text-anchor="middle" fill="#ff9a58" font-size="15" font-family="Arial" font-weight="bold">FIREWALL / ROUTE</text><text x="422" y="116" text-anchor="middle" fill="#e9e4d8" font-size="12" font-family="Arial">Compare both sides of hop</text><path d="M548 95h26m-7-6 7 6-7 6" fill="none" stroke="#ff842d" stroke-width="2"/><rect x="578" y="42" width="248" height="114" rx="10" fill="#14191d" stroke="#494238"/><text x="702" y="79" text-anchor="middle" fill="#ff9a58" font-size="15" font-family="Arial" font-weight="bold">SERVICE · B</text><text x="702" y="116" text-anchor="middle" fill="#e9e4d8" font-size="12" font-family="Arial">Did it arrive at capture B?</text><text x="20" y="184" fill="#b7b1a3" font-size="11" font-family="Arial">ILLUSTRATIVE ROLE / CAPTURE MAP. ARROWS SHOW THE PATH, NOT A COMPLETE PROTOCOL SEQUENCE.</text></svg>